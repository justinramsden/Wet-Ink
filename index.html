<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wet Ink</title>
<style>
  :root{ --paper:#f5eedf; --bg:#e6dfcf; --ink:#1c2d6b; --ember:#e8762b; --char:#23211e; --muted:#766c5b; --line:#cfc5b0; --panel:#fffdf8; --red:#d6402b; }
  *{box-sizing:border-box}

  .wrap{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:1200px;margin:0 auto;
        padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
  .bar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 12px;margin-bottom:8px;font-size:15px}
  .logo{font-size:17px;font-weight:700;letter-spacing:.2px}

  .group{display:flex;gap:4px;align-items:center}

  button:hover{background:#f0eadb}

  button i{display:inline-block;border-radius:50%;background:var(--ink)}
  button small{color:var(--muted)}
  .meter{display:flex;align-items:center;gap:6px;color:var(--muted)}
  .tube{width:170px;height:18px;border-radius:9px;background:#ebe4d3;border:1px solid var(--line);overflow:hidden}
  .tube b{display:block;height:100%;width:100%;background:var(--ink);border-radius:7px}
  .tube.flash{animation:fl .35s 2}
  .tube.low{border-color:#c98a00;box-shadow:0 0 0 2px rgba(201,138,0,.3)} .tube.low b{background:#c98a00}
  .tube.dry{border-color:#b3261e;box-shadow:0 0 0 2px rgba(179,38,30,.3)} .tube.dry b{background:#b3261e}
  .tube.sip b{background:repeating-linear-gradient(135deg,var(--ink) 0 6px,#4d8a3c 6px 10px)} .tube.sip{border-color:#4d8a3c}
  @keyframes fl{50%{box-shadow:0 0 0 3px #d6402b99}}
  .tube.big{border-color:#1f9e8f;box-shadow:0 0 0 2px rgba(31,158,143,.35)}
  .chip.res{color:#1f7a6f}
  #cEcho{color:#fff;background:#1a8fa8;border-color:transparent}
  .cab{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;width:min(760px,96%);max-height:94%;overflow:auto;line-height:1.3;box-shadow:0 6px 24px rgba(60,45,20,.16)}
  .cab h2{margin:0 0 2px;font-size:20px} .cab h2 small{font-size:14px;color:var(--muted);font-weight:600;margin-left:6px}
  .cab p{margin:0 0 10px;font-size:12px;color:var(--muted)} .cab p.empty{font-size:14px;margin:18px 0}
  .cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
  .tcard{background:#fbf8f0;border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px}
  .tcard.boss{border:2px solid #c98a00;background:#fff8e3} .tcard em{font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#a37612}
  .tcard canvas{position:static;inset:auto;width:66px;height:78px;image-rendering:pixelated;cursor:default;touch-action:auto}
  .tcard b{font-size:12.5px;line-height:1.2} .tcard span{font-size:11.5px;color:var(--muted);line-height:1.2} .tcard small{font-size:10.5px;color:#a8997c;margin-top:2px}
  .cab .row{display:flex;gap:8px;margin-top:12px}
  .tube.drought{border-color:#a37612} .tube.drought b{background:repeating-linear-gradient(90deg,var(--ink) 0 5px,#c9a03a 5px 8px)}
  .share{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);text-align:center} .share button{font-size:13px}
  .sharecard{text-align:center} .sharecard .qr{display:block;width:min(240px,60vw,52vh);height:auto;margin:6px auto;border-radius:8px;border:1px solid var(--line)}
  .sharecard p{margin:4px 0;color:var(--muted)} .sharecard .url{font-size:12px;user-select:all;word-break:break-all;color:var(--ink)} .sharecard .row{justify-content:center}
  .tune{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;width:min(460px,94%);max-height:92%;overflow:auto;line-height:1.3;box-shadow:0 6px 24px rgba(60,45,20,.16)}
  .tune h2{margin:0 0 2px;font-size:18px} .tune p{margin:0 0 8px;font-size:12px;color:var(--muted)}
  .tune label{display:grid;grid-template-columns:1fr 52px;gap:2px 8px;align-items:center;font-size:13px;margin:7px 0}
  .tune label input{grid-column:1 / 3;width:100%;accent-color:var(--ink)} .tune label b{text-align:right;font-variant-numeric:tabular-nums}
  .tune select{font:inherit;font-size:13px;padding:4px 6px;border:1px solid var(--line);border-radius:7px;background:#fff;grid-column:2 / 3;justify-self:end;min-width:0}
  .tune .row{display:flex;gap:8px;margin-top:10px} .tune button.primary{background:var(--ink);border-color:var(--ink);color:#fff}
  .tune.changes{width:min(980px,96%)} .tune.changes h2{font-size:24px} .tune.changes h2 small{font-size:15px;color:var(--muted);font-weight:600}
  .tune.changes table{border-collapse:collapse;width:100%;font-size:19px;margin:6px 0} .tune.changes td{padding:7px 10px;border-bottom:1px solid var(--line)}
  .tune.changes td b{font-size:22px;color:var(--ink)} .tune.changes td:nth-child(3){color:var(--muted)} .tune.changes td.key{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;color:var(--muted)}
  .chip{display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:700;padding:1px 5px;border-radius:7px;border:1px solid var(--line);background:#f8f4ea;font-variant-numeric:tabular-nums}

  .chip i.on{background:currentColor;opacity:1}
  .chip.max{color:#fff!important;border-color:transparent;animation:glow .5s infinite alternate}
  /* the three upgrade trees: as big as a health bar. Each segment is a level; the lit one drains as its clock runs */
  .trees{display:flex;gap:10px}
  .tree{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:7px;align-items:center;min-width:132px;padding:3px 8px 4px;border-radius:10px;border:1px solid var(--line);background:#fbf8f0;color:var(--c)}

  @keyframes blink{to{opacity:.35}}

  #bOpen{font-size:16px;padding:7px 11px} #bOpen svg{width:12px;height:14px}

  .menu-card .mrow button.wide{grid-column:1 / 3}
  @keyframes glow{to{box-shadow:0 0 0 3px rgba(201,138,0,.45)}}

  #bOpen.ready svg{fill:#fff}
  #overlay.handbg{background:rgba(245,238,223,.62)}

  .hrow{display:flex;gap:10px;justify-content:center;width:100%}
  .hcard{flex:1 1 0;max-width:170px;min-width:0;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;cursor:pointer;box-shadow:0 6px 24px rgba(60,45,20,.16);display:flex;flex-direction:column;gap:5px;align-items:center;font:inherit;color:var(--char)}
  .hcard:hover{border-color:var(--ink);background:#fff}

  .hcard b{font-size:16px} .hcard span{font-size:13px;color:var(--muted);line-height:1.3}
  .hcard small{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
  .hcard.max{border-color:#c98a00;box-shadow:0 0 0 3px rgba(201,138,0,.35),0 6px 24px rgba(60,45,20,.16)}

  .stat{color:var(--muted)} .stat b{color:var(--char);font-variant-numeric:tabular-nums}
  .stage{flex:1;min-height:0;position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper);line-height:0}
  canvas{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
  #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(245,238,223,.82);line-height:1.45}
  #overlay.hide{display:none}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 22px;max-width:min(430px,92%);max-height:92%;overflow:auto;text-align:left;box-shadow:0 6px 24px rgba(60,45,20,.12)}
  .card h2{margin:0 0 6px;font-size:22px}
  .card ul{margin:8px 0 14px;padding-left:20px;font-size:15px}
  .card li{margin:4px 0}
  .card .row{display:flex;gap:8px;flex-wrap:wrap}
  .card button{font-size:15px;padding:8px 14px}
  .card button.primary{background:var(--ink);border-color:var(--ink);color:#fff}
  .big{font-size:30px;font-weight:700;margin:4px 0}
  .card .small{font-size:13px;color:var(--muted)}
  /* phones (touch, small screen): the cave fills the whole screen and the toolbar floats over it, see-through between its parts */
  body.compact .wrap{padding:0;max-width:none}
  body.compact .stage{border:0;border-radius:0}
  body.compact .bar{position:absolute;z-index:6;top:max(3px,env(safe-area-inset-top));left:max(4px,env(safe-area-inset-left));right:max(4px,env(safe-area-inset-right));margin:0;padding:0;background:none;border:0;pointer-events:none;gap:4px 6px;font-size:12px;flex-wrap:nowrap}
  body.compact .bar > *{pointer-events:auto}
  body.compact .bar .stat, body.compact .bar .meter{background:rgba(255,253,248,.72);border-radius:8px;padding:3px 6px}
  body.compact .bar button{background:rgba(255,253,248,.78);padding:5px 7px;font-size:12px}
  body.compact .bar .group{gap:3px}
  body.compact .logo, body.compact .tag, body.compact .lbl, body.compact .best{display:none}
  body.compact .tube{width:54px}
  body.compact.tall .bar{flex-wrap:wrap}
  body.compact .bar .stat, body.compact .bar button{white-space:nowrap}
  body.compact .trees{gap:4px} body.compact .tree{min-width:84px;padding:2px 5px 3px} body.compact .tree .tn{font-size:9px} body.compact .tree em{font-size:10px} body.compact .tree .segs{height:7px}
  body.compact .stat.flock{font-size:16px} body.compact .stat.flock svg{width:16px;height:16px}
  @media (max-width:1040px){ .tree{min-width:108px} .tube{width:120px} .bar{gap:6px 10px} }
  @media (max-width:720px){ body.compact:not(.tall) .bar{font-size:11px;gap:3px} body.compact:not(.tall) .bar button{padding:4px 6px;font-size:11px} body.compact:not(.tall) .bar .stat{padding:3px 5px} body.compact:not(.tall) .tube{width:40px} }
  @media (max-width:620px){ body.compact:not(.tall) .bar{font-size:10px;gap:2px} body.compact:not(.tall) .bar button{padding:3px 5px;font-size:10px} body.compact:not(.tall) .bar .stat{padding:3px 4px} body.compact:not(.tall) .tube{width:30px} body.compact:not(.tall) .chip{transform:scale(.9);margin:0 -2px} }
  /* phones: one or two tight rows, short labels */
  @media (max-width:760px), (max-height:520px){
    .wrap{padding-left:max(4px,env(safe-area-inset-left));padding-right:max(4px,env(safe-area-inset-right));padding-top:max(4px,env(safe-area-inset-top));padding-bottom:max(4px,env(safe-area-inset-bottom))}
    .bar{gap:5px 8px;padding:4px 6px;margin-bottom:4px;font-size:12px;border-radius:9px}
    .logo,.tag,.lbl,.best{display:none}
    button{font-size:12px;padding:6px 8px;gap:4px}
    .tube{width:70px;height:14px}
    .trees{gap:5px} .tree{min-width:96px;padding:2px 6px 3px} .tree .segs{height:8px}
    .stat.flock{font-size:17px} .stat.flock svg{width:17px;height:17px}
    .hcard{padding:9px 5px} .hcard b{font-size:14px} .hcard span{font-size:12px} .hcard svg{width:34px;height:34px} .hcard kbd{display:none}
    .card{padding:14px 16px} .card ul{font-size:14px}
  }
  /* ---------- the camera column: a dial or strip on the right wall, outside the cave ---------- */
  #sc{display:none;left:auto;right:0;width:38px;cursor:ns-resize;background:#2b2620}
  .stage.scroll #c{width:calc(100% - 38px)}
  .stage.scroll #sc{display:block}
  /* ---------- home screen ---------- */
  #overlay.homebg{background:rgba(245,238,223,.94)}
  .home{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:44px 14px 14px;line-height:1.3;overflow:auto}
  .home .title{width:min(560px,92%,calc((100vh - 330px) * 2));min-width:min(260px,92%);aspect-ratio:2/1;image-rendering:pixelated;image-rendering:crisp-edges;border-radius:10px;border:3px solid var(--char);box-shadow:0 6px 0 rgba(35,33,30,.25);background:#f5eedf;object-fit:contain;position:static;inset:auto;height:auto;cursor:default;touch-action:auto;display:block}
  .home .bestline{font-size:15px;color:var(--muted);text-align:center} .home .bestline b{color:var(--char);font-variant-numeric:tabular-nums}
  .home .menu{display:flex;flex-direction:column;gap:7px;width:min(270px,90%)}
  .home .menu button{justify-content:center;font-size:16px;padding:10px 14px;border-radius:10px;background:var(--panel)}
  .home .menu button.primary{background:var(--ink);border-color:var(--ink);color:#fff;font-size:18px;font-weight:700}
  .home .menu button small{font-weight:400;opacity:.8}
  .home .menu button.primary small{color:#dfe5ff}
  .home .corner{position:absolute;top:10px;display:flex;gap:6px} .home .corner.l{left:10px} .home .corner.r{right:10px}
  .home .corner button{background:var(--panel);font-size:14px;padding:6px 10px;border-radius:999px}
  .home .ver{position:absolute;bottom:6px;right:10px;font-size:11px;color:#a8997c}
  body.athome .bar > *{opacity:.35;pointer-events:none}
  body.athome.compact .bar{visibility:hidden}
  @media (max-height:520px) and (min-width:560px){ .home{flex-direction:row;flex-wrap:wrap;gap:8px 18px;padding-top:42px} .home .title{width:min(52%,calc((100vh - 70px) * 2))} .home .left{display:flex;flex-direction:column;align-items:center;gap:6px} .home .menu button{padding:7px 12px;font-size:14px} .home .menu button.primary{font-size:16px} }
  .home .left{display:contents}
  @media (max-height:520px) and (min-width:560px){ .home .left{display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 1 auto;width:min(52%,calc((100vh - 70px) * 2))} .home .left .title{width:100%} }

  .players .prow .who{flex:1;min-width:120px;font-size:15px} .players .prow .who small{display:block;color:var(--muted);font-size:12px}

  .players .prow button{font-size:13px;padding:5px 9px}

  .players .add{display:flex;gap:6px;margin:12px 0 4px}

</head>
<body>
<div class="wrap">
  <div class="bar">
    <span class="logo">Wet Ink</span>
    <div class="meter" title="Ink"><div class="tube" id="tube"><b id="inkfill"></b></div><span class="chip res" id="cRes" title="Reservoir: bigger ink tank" style="display:none"></span></div>
    <div class="trees">
      <div class="tree" id="tLast" style="--c:#7d1741"><span class="tn">Time</span><span class="segs"><i><b></b></i><i><b></b></i><i><b></b></i></span><em></em></div>
      <div class="tree" id="tWide" style="--c:#1c2d6b"><span class="tn">Wide</span><span class="segs"><i><b></b></i><i><b></b></i><i><b></b></i></span><em></em></div>
      <div class="tree" id="tTough" style="--c:#a37612"><span class="tn">Strong</span><span class="segs"><i><b></b></i><i><b></b></i><i><b></b></i></span><em></em></div>
    </div>
    <span class="chip sp" id="cEcho" title="Echo: seconds left" style="display:none"></span>
    <button id="bOpen" title="Drops collected / drops needed for the next hand"></button>
    <div class="stat flock" title="Blots in the flock"><svg viewBox="0 0 14 14"><rect x="1" y="4" width="5" height="7" rx="2"/><rect x="8" y="2" width="5" height="9" rx="2"/><rect x="3.5" y="6" width="1.2" height="1.2" fill="#fff"/><rect x="10.5" y="4" width="1.2" height="1.2" fill="#fff"/></svg><b id="sFlock">16</b></div>
    <div class="group right">
      <button id="bPause" title="Pause (Space)">&#10074;&#10074;<span class="lbl">Pause</span></button>
      <button id="bHome" title="Home (H or Esc): pauses the run">&#8962;<span class="lbl">Home</span></button>
      <button id="bMenu" title="Menu: pause, sound, trophies, help, new cave">&#9776;<span class="lbl">Menu</span></button>
    </div>
  </div>
  <div class="stage">
    <canvas id="c"></canvas>
    <canvas id="sc"></canvas>
    <div id="overlay"></div>
  </div>
</div>

<script>
(() => {
'use strict';

// ---------------- tuning: every number worth arguing about ----------------
const TUNE = {
  walkers: 16,        // flock size
  spawnEvery: 0.9,    // seconds between walkers leaving the hatch
  walkSpeed: 32,      // px per second
  gravity: 600, terminal: 240,
  fatalFall: 136,     // px; a longer fall kills
  maxStepUp: 12, maxStepDown: 12,   // px a walker can step without turning or falling
  inkMax: 50, inkRegen: 6.5,        // ink units, units per second (the tank was 100 when ink dried in 4 s; now it lasts twice as long, so half the tank)
  dryLock: 0.5,       // seconds the pen stays dry after the tank runs empty: a brief sting, short enough that a quick hand can still save a falling blot
  dryRefill: 1,       // after running dry, the tank refills this many times faster until it is back to dryTo (1 = off: empty means careful drawing until you can rest)
  dryTo: 0.6,         // share of the tank the fast recovery fills to
  lowWarn: 0.25,      // below this share of the tank the pen warns: a scratchy sound once, and the tube turns amber
  sputterAt: 0.12,    // below this share the pen sputters: thinner, broken line
  penNormal: 600,     // the pen pours ink at a fixed rate. At this speed (px/s) the line is the standard 8 px; twice as fast gives a 4 px hairline for half the ink, and slowing down swells it to 12 px
  penRange: 1,        // how strongly speed changes the line (0 = always the standard line)

    <ul><li>The flock never stops walking.</li>
    <li>A fall past the <b style="color:var(--red)">red dots</b> kills.</li>
    <li>Draw to catch them. Ink is solid only while it is wet, and it dries from where your stroke began. Thicken a line to make it last.</li>
    <li>Birds come after 15 m. Block a dive with ink to stun the bird, then loop it while it's dazed. Three cages send it off.</li>
    <li>Steer clear of the <b style="color:var(--red)">red spiked bombs</b>.</li>
    <li>After 60 m a <b>Brute</b> drops in. It can't be hurt by falls: wall it in with ink and leave it well behind, out of sight above the flock.</li>
    <li>Collect <b>drops</b>. Four open a hand of three upgrade cards. The three bars at the top are your upgrade trees: each segment is a level, and the lit one drains as its clock runs.</li>
    <li><b>The camera is yours.</b> The strip on the right wall drags like a page, and the mouse wheel slides the view. The arrow buttons above and below the strip (or the up and down arrow keys) jump straight to a separated group of blots. Leave the view with the middle of the flock off screen and, after a warning, it catches up on its own. Looking never changes what the cave does: enemies, the Fade and rewards follow the flock, not your view.</li>
    <li>Ink refills at a steady rate, even while you draw, and a full tank takes longer to come back than a line takes to dry. Run it dry and the pen stops for half a second; after that, draw small and smart until the tank recovers. A quick, thin stroke uses less ink than a slow, thick one.</li>
    <li>Don't leave blots far behind: the page above you fades.</li>
    <li><b>&#8962; Home</b> (or H / Esc) pauses the run; Continue picks it up again.</li></ul>
    <h3 style="margin:10px 0 0;font-size:16px">Everything else</h3>
    <ul>
      <li><b>Ink</b> is solid only while wet. A line dries in the order you drew it, so start each stroke where the flock steps first. Ink dries from the outside in, a thin skin at a time: a plain line loses its skin first and its heart about a second later, and every extra 2 px of thickness buys about another second. Draw lines side by side to build something that lasts.</li>
      <li><b>Drops</b> lie around the cave. When you have enough, a hand of three cards opens as soon as you lift your pen; each hand costs a little more than the last. Cards: <b>Time</b> (ink lives longer, turning from indigo to wine; at MAX everything you draw holds until 16 s after the countdown ends, then dries all at once), <b>Wide</b> (a brush twice as broad for the same ink; at level 2 broader still, and soft: a fall onto it can be twice as long as a deadly one and never dazes; at MAX, parachutes: no blot can die from a fall, and one still floating when the timer ends lands safely), <b>Strong</b> (glossy ink every enemy struggles with: Brutes chew it slowly and then not at all, leeches drink less and then nothing, birds that hit it stay stunned longer; lasts 90 s, then 60 s at level 2; at MAX, 30 s in which any enemy you shut inside ink is crushed), <b>Reinforcements</b> (+6 blots), or <b>Reservoir</b> (a bigger, full ink tank for a while).</li>
      <li><b>Chests</b> sit on some gold shelves. A blot that reaches one opens a free hand holding a special card. <b>Echo</b> lasts 20 seconds and sometimes turns up in ordinary hands too: every line you draw leaves a shimmering outline, and as each part of the line dries (or is chewed or drunk), fresh ink pours back into it once, with the same width, toughness and life. Everything you draw lasts twice as long.</li>
      <li>Every level runs on its own clock, shown on the bars at the top: level 1 lasts 45 s, level 2 30 s, and MAX is a 30 s burst (Strong runs 90, 60 and 30). When a clock runs out the track steps down one level and that level's clock starts fresh, so taking the next level just before the old one runs out is two for one.</li>
      <li><b>The fade:</b> the page goes blank 60 m above the deepest point the middle of your flock has reached. Blots still up there are lost, and so are Brutes and leeches.</li>
      <li><b>Falls</b> past the red dots kill. A short dash halfway down splits one deadly fall into two safe ones.</li>
      <li><b>Birds</b> (3 health) hover, screech and dive along a red line. Ink across the line stuns them for 4 s. Draw a closed loop around a <i>stunned</i> bird to take a health point; it gets faster each time. A loop around a bird that isn't stunned only holds it. Trapping a bird that carries a blot makes it drop it.</li>
      <li><b>Pickups:</b> bare ink drops are the currency. Grey ring = +1 blot, teal on ledges (+3, three drops, haste, and \u00bd half-time: the whole cave slows for a few seconds while your pen does not), gold on high shelves (+5 blots or a chest, draw a ramp up). Beaten birds, leeches and Brutes pay out drops too.</li>
      <li><b>Blots</b> differ a little in speed: tall and thin is fast, short and squat is slow. A rough landing (close to deadly) dazes them for 2 s.</li>
      <li><b>The Brute</b> is slow and heavy, takes no fall damage and shoves blots aside; blots pinned against a wall are crushed. When it lands from a drop it slams the ground: blots right under it die, and those nearby are thrown back and stunned. It chews through plain ink about 3x faster than ink dries. Hold it behind ink and let the flock walk away: once it's above the top of the screen, it's gone. A bomb kills it too.</li>
      <li><b>The Leech</b> (after 35 m) crawls over rock, walls and ceilings toward any ink that touches rock, and drinks your ink meter while it sits on it (only while it is on screen; the ink bar turns green-striped). It can't reach ink floating in open air. Blots that touch it, or step in the trail it leaves for 8 s, are slimed: a third of their speed for 6 s, never hurt. With no ink to drink it heads for your tightest group. It dies from a long fall, so lure it onto ink over a deadly drop and let the ink dry. A bomb kills it too.</li>
      <li><b>Formations</b> are the paler rock shapes standing on floors. <b>Hills</b> you walk straight over. <b>Walls</b> need a ramp. <b>One-ways</b> have a gentle slope and a cliff, so blots pass in one direction only. None is ever too tall to ramp over, and no cliff is tall enough to kill.</li>
      <li><b>Bosses</b> wait in sealed arenas every 600 m or so. The flock comes in down a stair and cannot leave until the gate opens. Beat the boss for a chest, or outlast its clock for nothing.</li>
      <li><b>Matriarch</b> (and later the <b>Twins</b>): a red line shows the swoop. Put a wall of ink across it so she crashes, then cage her while she is stunned.</li>
      <li><b>Wyrm</b>: it marks a spot ahead of the flock and a dashed red box above it. Draw ink across that box (any height inside it) and the box turns blue: the Wyrm bites the ink instead of blots, and three bites beat it.</li>
      <li><b>Crown</b>: red marks on the ceiling show where shards will fall. Draw a roof over the flock. After each volley its eye comes down: draw a loop around the eye.</li>
      <li><b>Leech Queen</b>: she eats blots, but she would rather drink. Draw ink where she can reach it and she climbs to the far end of it and drinks hard; when that ink dries she falls. A fall from higher than a blot is tall hurts her.</li>
      <li><b>Sponge Golem</b>: ink near it dries three times as fast, and ink that touches it is soaked up. Scribble on it until it is soaked through. Keep blots clear of the red mark before it stomps.</li>
      <li><b>Rival</b>: a red pen draws a line through the flock, and the line goes off a few seconds later. Trace over most of it with your own ink to strike it out, then draw a loop around the stunned pen.</li>
      <li><b>Events</b> come between arenas, on open ground. <b>Brute raid</b> or <b>Rager stampede</b>: leave them all behind. <b>Flock of birds</b>: one heart each, cage most of them. <b>Leech swarm</b>: splatter at least half. <b>Drought</b>: ink refills slowly; lose no blots. <b>Grinder</b>: it chews down from the top of the screen; stay below it. Each pays a chest.</li>

      <li><b>Trophies</b> glow on formation tops, ledges, a few gold shelves and every giant's summit. They do nothing at all. Each one is different. The trophy button (or C) opens your cabinet.</li>
      <li><b>Terrain:</b> <b>hanging spikes</b> shake, then drop when anything walks over them. They kill what they hit (blots, leeches, even a Brute) and stand where they land as a wall: draw a ramp over it. Wet ink catches a falling spike until the ink dries. <b>Cracked floor</b> collapses after a few blots. <b>Purple mushrooms</b> bounce a falling blot and make any fall safe, but throw it sideways. <b>Yellow sponge rock</b> dries nearby ink three times as fast, so draw clear of it.</li>
      <li>The camera holds still while you're drawing.</li>

  boss: () => boss ? { type: boss.type, phase: boss.phase, t: boss.t, clock: boss.clock, left: boss.left, beat: boss.beat, won: boss.won, m: boss.m ? { x: boss.m.x, y: boss.m.y, state: boss.m.state, hp: boss.m.hp, t: boss.m.t, tell: boss.m.tell, eaten: boss.m.eaten, stunFor: boss.m.stunFor, path: boss.m.path, face: boss.m.face } : null } : null,
  stratum: () => stratum, setStratum(n) { stratum = n; hudC = {}; }, carve: y => carveStratum(y), setRecord(m) { recordAt = m; }, regions: () => regions, handCost: () => handCost(), caps: () => ({ birds: (depthM() > 150 ? 2 : 1) + extraBirds(), brutes: 1 + extraBrutes(), leeches: 1 + extraLeeches() }),
  forceRaid(k, kind) { const R = { kind: kind || 'raid', k, row: (maxY >> 2) + 2, state: 'wait', seed: (Math.random() * 4294967296) >>> 0 }; nameRaid(R); raids.push(R); return R.title + ' / ' + R.sub; },
  bx: () => { if (!boss) return null; const o = { type: boss.type, phase: boss.phase, hp: boss.hp, hpMax: boss.hpMax, clock: boss.clock };
    if (boss.c) { const c = boss.c; o.c = { state: c.state, t: c.t, tell: c.tell, marks: c.marks.map(m => ({ x: m.x, d: m.d, done: !!m.done })), shards: c.shards.length, eyeX: c.eyeX, eyeY: c.eyeY, eaten: c.eaten, pat: c.pat }; }
    if (boss.r) { const r = boss.r; o.r = { x: r.x, y: r.y, state: r.state, t: r.t, frac: r.frac, drawn: r.drawn, eaten: r.eaten, pts: r.pts.map(p => [p.x, p.y, p.c ? 1 : 0]) }; }
    if (boss.g) { const g = boss.g; o.g = { x: g.x, state: g.state, soak: g.soak, need: g.need, t: g.t, eaten: g.eaten }; }
    if (boss.q) { const L = boss.q; o.q = { px: L.px, py: L.py, state: L.state, drinking: L.drinking, hp: L.hp, eaten: L.eaten, stunned: T < L.stunT }; }
    if (boss.ms) o.ms = boss.ms.map(m => ({ x: m.x, y: m.y, state: m.state, hp: m.hp, t: m.t, path: m.path, eaten: m.eaten }));
    return o; },
  ev: () => raid ? { kind: raid.kind, state: raid.state, t: raid.t, beat: raid.beat, left: raid.left, y: raid.y, caught: raid.caught, won: raid.won, title: raid.title, sub: raid.sub } : null,
  raids: () => raids.map(R => ({ kind: R.kind, won: R.won, k: R.k, row: R.row, state: R.state, count: R.count, ragers: R.ragers, title: R.title, sub: R.sub, beat: R.beat })), raidBrutes: () => brutes.filter(b => b.raid).map(b => ({ x: b.x, y: b.y, state: b.state, rager: !!b.rager })),
  wyrm: () => boss && boss.w ? { x: boss.w.x, state: boss.w.state, hp: boss.w.hp, t: boss.w.t, tell: boss.w.tell, eaten: boss.w.eaten, spots: boss.w.spots.map(q => ({ x: q.x, kind: q.kind })), holes: boss.holes.length } : null, plated: (k, x) => wyrmPlated(arenas[k], x),
  packBrutes: () => brutes.filter(b => b.pack).map(b => ({ x: b.x, y: b.y, state: b.state, dir: b.dir })), pending: () => pendingChest,
  forms: () => forms.map(f => ({ ...f })), bands: () => bands.map(b => ({ F: b.F, d: b.d, chamber: !!b.chamber })),
  trophies: () => trophies.map(t => ({ x: t.x, y: t.y, taken: t.taken })), cab: () => cab.slice(), trophyOf: sd => { const t = mkTrophy(sd); return { name: t.name, place: t.place, fam: t.fam, cells: Array.from(t.g).filter(v => v).length }; },
  chutes: () => walkers.filter(w => w.alive && w.chute).length, dropWalker(x, y, dir) { walkers.push({ x, y, fy: y, dir: dir || 1, grounded: false, vy: 0, fallStart: y, alive: true, acc: 0, haste: 0, bomb: 0, carried: null, spd: 1, h: 12, wd: 8, daze: 0, stun: 0, vx: 0, ax: 0, bn: 0, slimed: 0 }); },
  audit() {                                 // check every formation against the safety rules
    const bad = [], sOf = c => { for (let r = 2; r < terrain.length; r++) if (terrain[r][c]) return r; return -1; };
    for (const f of forms) {
      const colTop = c => { if (tt(c, Math.max(1, f.top - 2))) return -1; for (let r = Math.max(1, f.top - 2); r < f.top + 120; r++) if (tt(c, r)) return r; return -1; };   // a column roofed over from above is not a surface
      for (let c = Math.max(1, f.c0); c < Math.min(COLS - 1, f.c0 + f.w); c++) {
        if (tt(c, colTop(c)) !== 5) continue;
        const s = colTop(c);
        for (let k = 1; k <= 8; k++) if (tt(c, s - k)) { bad.push('headroom cls' + f.cls + ' v' + f.v + ' band' + f.band + ' col' + c); break; }
      }
      for (let c = Math.max(1, f.c0 - 1); c < Math.min(COLS - 2, f.c0 + f.w); c++) { const a = colTop(c), b = colTop(c + 1); if (a < 0 || b < 0) continue; if (Math.abs(a - b) > 30) bad.push('cliff ' + Math.abs(a - b) + ' rows cls' + f.cls + ' v' + f.v + ' band' + f.band + ' col' + c); if (f.cls === 0 && Math.abs(a - b) > 3) bad.push('hill step ' + Math.abs(a - b) + ' v' + f.v + ' band' + f.band + ' col' + c); }
    }
    return bad;
  },
  tt: (x, y) => tt(Math.floor(x) >> 2, Math.floor(y) >> 2), wickAt: (x, y) => { const wr = wick[Math.floor(y) >> 2]; return !!(wr && wr[Math.floor(x) >> 2]); },
  spikes: () => spikes.map(q => ({ x: q.x, y: Math.round(q.y), topY: q.topY, state: q.state })),
  stakes: () => stakes.map(k => ({ x: k.x, top: k.top, bot: k.bot, hp: k.hp })),
  crumbles: () => crumbles.map(k => ({ x0: k.c0 * CELL, x1: k.c1 * CELL, y: k.r0 * CELL, hp: k.hp, broken: k.broken })),
  mushrooms: () => mushrooms.filter(m => m.alive).map(m => ({ x: m.x, y: m.y })),
  addMushroom(x, y) { mushrooms.push({ x, y, hw: 11, sq: -9, alive: true }); remeasure(y); },
  addSpike(x, y, topY) { spikes.push({ x, y, topY, len: TUNE.spikeLen, state: 'hang', t: 0, vy: 0, y0: 0 }); },
  dropSpike(i) { const q = spikes[i]; if (q) { q.state = 'shake'; q.t = 0; } },
  cam(y) { camY = y; drawing = true; },
  weigh(i, amt) { const k = crumbles[i]; if (k) weighCrumble(k.c0 + 1, k.r0, amt); },
  biomes: r => { biomeAt(r); return biomes.map(b => [b.start, b.end, b.col.join('/')]); },
  leeches: () => leeches.map(L => ({ x: Math.round(L.px), y: Math.round(L.py), state: L.state, drinking: L.drinking, path: L.path.length })),

  brutes: () => brutes.map(b => ({ x: b.x, y: b.y, state: b.state, dir: b.dir, pushing: b.pushing, seen: b.seen })),
  setDrawing(v) { drawing = v; },
  walkersFull: () => walkers.filter(w => w.alive).map(w => ({ x: w.x, y: w.y, spd: +w.spd.toFixed(3), dazed: T < w.daze })),
  birds: () => birds.map(b => ({ x: b.x, y: b.y, state: b.state, carrying: !!b.carry, hp: b.hp })),
  give(type, idx) { const w = walkers.filter(o => o.alive && o.grounded)[idx || 0]; if (!w) return false; collect(w, { x: w.x, y: w.y, type, tier: 2, taken: false }); return { x: w.x, y: w.y }; },
  pickups: () => pickups.map(p => ({ x: p.x, y: p.y, type: p.type, tier: p.tier, taken: p.taken })),
  stats: () => stats, terrainAt: (x, y) => stateAt(x, y),
  info: () => ({ state, T, ink: inkLeft, cam: camY, seed, spawned, flock: flockCount(), depth: depthM(), bands: bands.length,
    walkers: walkers.map(w => ({ x: w.x, y: w.y, alive: w.alive, grounded: w.grounded, dir: w.dir })) }),
};

applyCam();
newWorld(randSeed());
cloudInit();   // fetch the account's cabinet in the background; the game never waits for it
showHome();
requestAnimationFrame(frame);
})();
</script>
